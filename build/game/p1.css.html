<title>RYVO Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Layout: a sticker-book arcade. Paper ground, ink outlines, each game owns one loud colour. Light by design, single theme. */
  color-scheme:light;
  --paper:#FBF8F3; --wash:#F3EEE6; --card:#FFFFFF; --ink:#17142A; --ink2:#4A4560; --mute:#7C7792; --line:#E8E2D8; --line2:#D3CCBF;
  --brand:#5B4BFF; --brand2:#8B7BFF; --brand-soft:#ECEAFF; --hot:#FF6B3D; --sun:#FFC93C; --good:#0E9F64; --good-soft:#DDF5EA; --bad:#E5364B; --bad-soft:#FDE3E6;
  --c-sprint:#3D7BFF; --c-reflex:#FF6B3D; --c-brain:#8B5CF6; --c-cards:#FFB800; --c-stack:#FF4FA0; --c-grid:#14B37A; --c-words:#00A6C8; --c-aim:#F23F55; --c-party:#B5B0C7;
  --f-d:'Bricolage Grotesque',ui-rounded,'Avenir Next',system-ui,sans-serif;
  --f-b:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --sh:3px 3px 0 var(--ink); --sh2:5px 5px 0 var(--ink);
  --r:14px; --r2:22px;
}
body[data-skin="coral"]{--brand:#F2542D;--brand2:#FF8A5C;--brand-soft:#FFE8DF}
body[data-skin="mint"]{--brand:#0E9F78;--brand2:#3CC79E;--brand-soft:#DDF5EC}
body[data-skin="berry"]{--brand:#D6336C;--brand2:#F06595;--brand-soft:#FDE6EE}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.2px);background-size:22px 22px;opacity:.55}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
#view:focus,#view:focus-visible{outline:none}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(26px,3.6vw,40px);font-weight:800;letter-spacing:-.025em}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.eyebrow{font:700 11px/1.3 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.mu{color:var(--ink2)} .dim{color:var(--mute)} .good{color:var(--good)} .bad{color:var(--bad)}
.tiny{font-size:12.5px;color:var(--ink2)}
.ic{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 14px;border-right:2px solid var(--ink);background:var(--card);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px;font:800 24px/1 var(--f-d);letter-spacing:-.02em;background:none;border:0;cursor:pointer;color:var(--ink)}
.logo small{display:block;font:700 9px/1 var(--f-m);letter-spacing:.14em;color:var(--mute);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .sep{height:2px;background:var(--line);margin:10px 8px;border-radius:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:600;background:none;border:2px solid transparent;cursor:pointer;text-align:left}
.nav button:hover{color:var(--ink);background:var(--wash)}
.nav button[aria-current="page"]{color:#fff;background:var(--ink);border-color:var(--ink)}
.side-card{margin-top:auto;padding:14px;border-radius:18px;background:var(--brand-soft);border:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}
main{min-width:0;padding-inline:30px;padding-block:0 48px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:14px;background:linear-gradient(var(--paper) 75%,transparent)}
#top .grow{flex:1;min-width:0}
.top-logo{display:none}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:13px;border:2px solid var(--ink);background:var(--card);cursor:pointer;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.iconbtn:hover{background:var(--wash)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.iconbtn .dot{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--hot);color:#fff;border:2px solid var(--ink);font:700 10px/16px var(--f-m)}
.stat-chip{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:13px;border:2px solid var(--line2);background:var(--card);font:700 13px/1 var(--f-m);white-space:nowrap}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:13px;overflow:hidden;height:42px;background:var(--card);box-shadow:2px 2px 0 var(--ink)}
.lang button{border:0;background:none;padding:0 10px;font:700 12px/1 var(--f-m);cursor:pointer;color:var(--ink2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.me-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 4px;border-radius:13px;border:2px solid var(--ink);background:var(--card);cursor:pointer;font-weight:700;max-width:200px;box-shadow:2px 2px 0 var(--ink)}
.me-btn span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--ink)}
#mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10.5px/1.1 var(--f-b);color:var(--ink2);background:none;border:0;padding:6px 2px;min-height:52px;cursor:pointer;border-radius:12px}
#mnav button[aria-current="page"]{color:var(--ink);background:var(--sun)}
.foot{margin-top:40px;padding-top:18px;border-top:2px dashed var(--line2);display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mute);font-size:12px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #side{display:none}
  main{padding-inline:16px;padding-block:0 110px}
  #mnav{display:flex}
  .top-logo{display:flex}
  .hide-m{display:none!important}
}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r2);padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card.pop{border:2px solid var(--ink);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:13px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 14px/1 var(--f-b);cursor:pointer;box-shadow:var(--sh);transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--wash)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
.btn.hot{background:var(--sun);color:var(--ink)}
.btn.hot:hover{background:color-mix(in srgb,var(--sun) 88%,#000)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--wash)}
.btn.ghost:active{transform:none}
.btn.big{height:58px;padding:0 28px;font:800 18px/1 var(--f-d);letter-spacing:-.01em;border-radius:18px;box-shadow:var(--sh2)}
.btn.big:active{transform:translate(5px,5px)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}
.btn.sm.ghost{box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font:700 10px/1 var(--f-m);letter-spacing:.05em;text-transform:uppercase;border:1.5px solid var(--line2);color:var(--ink2);white-space:nowrap;background:var(--card)}
.pill.sim{border-style:dashed;color:#8A5A00;border-color:#E3B341;background:#FFF7DD}
.pill.now{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:var(--good-soft)}
.pill.future{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent);background:var(--brand-soft)}
.pill.warn{color:#9A3412;border-color:#F4A27F;background:#FFEDE4}
.pill.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.sticker{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;border:2px solid var(--ink);background:var(--sun);color:var(--ink);font:800 11px/1 var(--f-d);letter-spacing:.02em;text-transform:uppercase;transform:rotate(-5deg);box-shadow:2px 2px 0 var(--ink)}
.sticker.pink{background:var(--c-stack);color:#fff}
.sticker.mint{background:#B8F2D9}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;border:2px solid var(--line2);background:var(--card);color:var(--ink2);font:600 13px/1 var(--f-b);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:15px;background:var(--wash);border:2px solid var(--ink);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:34px;padding:0 14px;border-radius:10px;border:0;background:none;color:var(--ink2);font-weight:700;cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
.bar{height:10px;border-radius:99px;background:var(--wash);border:1.5px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.sun i{background:var(--sun)}
.bar.thin{height:8px;border-width:1px;border-color:var(--line2)}
.avw{display:inline-grid;place-items:center;flex:none;border-radius:32%;line-height:0}
.avw svg{display:block}
.fr-basic{}
.fr-gold{box-shadow:0 0 0 2px var(--paper),0 0 0 5px var(--sun)}
.fr-brand{box-shadow:0 0 0 2px var(--paper),0 0 0 5px var(--brand)}
.fr-candy{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--c-stack),0 0 0 7px var(--sun)}
.fr-mint{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--c-grid),0 0 0 7px var(--c-words)}
.fr-holo{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--c-brain),0 0 0 7px var(--c-reflex),0 0 0 10px var(--sun)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:700;font-size:13px}
.field .help{font-size:12px;color:var(--mute)}
.field .err{font-size:12.5px;color:var(--bad);font-weight:600}
.input{height:46px;padding:0 14px;border-radius:13px;border:2px solid var(--line2);background:var(--card);width:100%;min-width:0}
textarea.input{height:auto;min-height:120px;padding:12px 14px;font:12px/1.5 var(--f-m);resize:vertical}
.input:focus{outline:none;border-color:var(--ink);box-shadow:3px 3px 0 var(--brand)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;border:2px dashed #E3B341;background:#FFF9E6;font-size:13px;color:var(--ink)}
.note .ic{color:#B7791F;margin-top:2px}
.note.err{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:var(--bad-soft)}
.note.err .ic{color:var(--bad)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 16px;border:2px dashed var(--line2);border-radius:18px;color:var(--ink2);background:var(--paper)}
.empty b{color:var(--ink);font-family:var(--f-d);font-size:16px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 22px}
.page-h p{color:var(--ink2);margin-top:8px;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1180px){.c3,.c4{grid-column:span 6}.c5,.c7,.c8{grid-column:span 12}}
@media (max-width:720px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:16px;background:var(--paper);border:1.5px solid var(--line2);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font:800 24px/1.1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi small{color:var(--ink2);font-size:12px;font-weight:600}
.skel{height:46px;border-radius:12px;background:linear-gradient(90deg,var(--wash),#fff,var(--wash));background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- home ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) auto;gap:24px;align-items:center;padding:26px;border-radius:28px;border:2px solid var(--ink);box-shadow:var(--sh2);background:var(--brand);color:#fff;overflow:hidden}
.hero::before{content:"";position:absolute;right:-80px;bottom:-120px;width:360px;height:360px;border-radius:50%;background:var(--brand2);opacity:.6}
.hero::after{content:"";position:absolute;right:140px;top:-50px;width:120px;height:120px;border-radius:30px;background:var(--sun);transform:rotate(18deg);border:2px solid var(--ink)}
.hero>*{position:relative;z-index:1}
.hero-id{display:flex;gap:18px;align-items:center;min-width:0}
.hero-id .meta{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.hero-id h1{overflow-wrap:anywhere}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero .tiny{color:rgba(255,255,255,.88)}
.hero .bar{border-color:var(--ink);background:rgba(255,255,255,.25)}
.hero .bar i{background:var(--sun)}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hs{padding:12px;border-radius:16px;background:var(--card);color:var(--ink);border:2px solid var(--ink);min-width:0}
.hs b{display:block;font:800 24px/1.05 var(--f-d);font-variant-numeric:tabular-nums;margin-top:2px}
.hs small{color:var(--ink2);font-size:11.5px;font-weight:600}
.hero-cta{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.hero-cta .btn.big{background:var(--sun);color:var(--ink)}
.next{font-size:13px;color:#fff;max-width:28ch}
.next b{color:#fff;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
@media (max-width:1180px){.hero{grid-template-columns:1fr}.hero::after{right:20px;top:-60px}.next{max-width:none}}
@media (max-width:520px){.hero{padding:18px;border-radius:22px}.hs{padding:9px}.hs b{font-size:18px}}
.league{display:inline-flex;align-items:center;gap:5px;font:700 12px/1 var(--f-m);color:inherit}
.league svg{width:15px;height:15px}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1.5px dashed var(--line)}
.mi:first-child{border-top:0;padding-top:0}
.mi b{font-weight:600;font-size:14px;display:block;margin-bottom:8px}
.mi.done b{color:var(--good)}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1.5px dashed var(--line)}
.feed li:first-child{border-top:0}
.feed li.new{animation:slidein .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes slidein{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.feed .txt{font-size:13.5px;min-width:0}
.feed .txt b{font-weight:700}
.feed .txt small{display:block;color:var(--ink2);font-size:12px}
.vsdot{display:inline-flex}
.vsdot .avw+.avw{margin-left:-10px}

/* ---------- game tiles ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.games.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.games.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.games.four,.games{grid-template-columns:minmax(0,1fr)}}
.gcard{--g:var(--brand);position:relative;display:flex;flex-direction:column;border-radius:22px;border:2px solid var(--ink);background:var(--card);box-shadow:var(--sh);transition:transform .12s,box-shadow .12s;min-width:0;text-align:left;padding:0;cursor:pointer;color:var(--ink)}
.gcard:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.gcard:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.gcard.off{cursor:default;box-shadow:none;border-style:dashed;border-color:var(--line2)}
.gcard.off:hover{transform:none}
.gart{aspect-ratio:16/9;background:var(--g);border-radius:20px 20px 0 0;border-bottom:2px solid var(--ink);display:grid;place-items:center;overflow:hidden;position:relative}
.gcard.off .gart{border-bottom:2px dashed var(--line2);filter:saturate(.25)}
.gart svg{width:100%;height:100%}
.gcard .sticker{top:-10px;right:-8px}
.gbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.gbody h3{font:800 18px/1.1 var(--f-d);letter-spacing:-.01em}
.gbody .tag{color:var(--ink2);font-size:13px;line-height:1.4}
.gmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font:600 11.5px/1.3 var(--f-m);color:var(--mute)}
.gmeta b{color:var(--ink)}
.gmodes{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.gmodes span{font:700 9.5px/1 var(--f-m);letter-spacing:.04em;text-transform:uppercase;padding:5px 7px;border-radius:7px;background:var(--wash);color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.filters .field{width:auto;min-width:150px}
.filters .input{height:40px}

/* ---------- leaderboards ---------- */
.lb{display:flex;flex-direction:column;gap:4px}
.lb-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto 44px;gap:12px;align-items:center;padding:8px 10px;border-radius:14px;border:2px solid transparent}
.lb-row:nth-child(odd){background:var(--paper)}
.lb-row .pos{font:800 16px/1 var(--f-d);color:var(--mute);text-align:center}
.lb-row.top .pos{color:var(--ink)}
.lb-row .who{display:flex;align-items:center;gap:10px;min-width:0}
.lb-row .nm{display:flex;flex-direction:column;min-width:0}
.lb-row .nm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .nm b em{font-style:normal;font:800 9.5px/1 var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--brand);padding:3px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.lb-row .nm small{color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .val{font:700 13.5px/1 var(--f-m);font-variant-numeric:tabular-nums;text-align:right}
.lb-row.me{background:var(--brand-soft)!important;border-color:var(--ink)}
.mv{font:700 11px/1 var(--f-m);text-align:right;color:var(--mute)}
.mv.up{color:var(--good)} .mv.dn{color:var(--bad)}
.lb-gap{text-align:center;color:var(--mute);letter-spacing:.3em;font-size:12px;padding:2px 0}
.lb-row.unranked{grid-template-columns:38px minmax(0,1fr) auto}
@media (max-width:520px){.lb-row{grid-template-columns:28px minmax(0,1fr) auto 32px;gap:8px;padding:8px 6px}}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin-bottom:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .nm{font:700 13.5px/1.2 var(--f-b);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .val{font:700 12px/1 var(--f-m);color:var(--ink2)}
.pod .blk{width:100%;border:2px solid var(--ink);border-radius:14px 14px 0 0;border-bottom:0;display:grid;place-items:center;font:800 28px/1 var(--f-d);box-shadow:3px 0 0 var(--ink)}
.pod.p1 .blk{height:92px;background:var(--sun)}
.pod.p2 .blk{height:66px;background:#DCD8E8}
.pod.p3 .blk{height:48px;background:#F6C8A8}
.pod.me .nm{color:var(--brand)}

/* ---------- lobby / result ---------- */
.lobby-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:stretch}
@media (max-width:900px){.lobby-head{grid-template-columns:1fr}}
.lobby-art{border-radius:18px;border:2px solid var(--ink);overflow:hidden;background:var(--g);aspect-ratio:16/9}
.lobby-art svg{width:100%;height:100%;display:block}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;border:2px solid var(--line2);background:var(--card);cursor:pointer;text-align:left;min-width:0}
.mode:hover{border-color:var(--ink)}
.mode b{font:800 15px/1.15 var(--f-d)}
.mode small{color:var(--ink2);font-size:12px;line-height:1.35}
.mode[aria-checked="true"]{border-color:var(--ink);background:var(--brand-soft);box-shadow:var(--sh)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opp{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--paper);border:2px solid var(--line2)}
.spark{width:100%;height:60px}
.rules li{position:relative;padding-left:22px;margin-top:8px;color:var(--ink2);font-size:14px}
.rules li::before{content:"";position:absolute;left:3px;top:6px;width:10px;height:10px;border-radius:3px;background:var(--g,var(--brand));border:1.5px solid var(--ink);transform:rotate(12deg)}
.res-hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 20px 26px;border-radius:28px;border:2px solid var(--ink);box-shadow:var(--sh2);background:var(--rbg,var(--card));color:var(--rfg,var(--ink));overflow:hidden}
.res-hero .big{font:800 clamp(48px,9vw,88px)/1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.res-hero .outcome{display:inline-block;padding:8px 16px;border-radius:12px;background:var(--ink);color:#fff;font:800 15px/1 var(--f-d);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-3deg)}
.res-hero .eyebrow{color:inherit;opacity:.8}
.res-hero .mu{color:inherit;opacity:.9}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;font-size:14px;margin:0}
.cmp dt{color:var(--ink2)} .cmp dd{margin:0;text-align:right;font:700 13.5px/1.4 var(--f-m);font-variant-numeric:tabular-nums}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:2px solid var(--ink);min-width:0;box-shadow:2px 2px 0 var(--ink)}
.ach.locked{opacity:.45;border-style:dashed;border-color:var(--line2);box-shadow:none}
.ach b{display:block;font-size:13px}
.ach small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.3}
.minibars{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.minibars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 10.5px/1 var(--f-m);color:var(--ink2);height:100%;justify-content:flex-end}
.minibars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--g,var(--brand));border:1.5px solid var(--ink)}

/* ---------- game frame ---------- */
.gframe{display:flex;flex-direction:column;gap:14px}
.gframe-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gframe-h h1{font-size:24px}
.gframe-h .grow{flex:1}
.stage{position:relative;border-radius:24px;border:2px solid var(--ink);background:var(--card);box-shadow:var(--sh2);padding:16px;min-width:0}
.shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.hint{font-size:12.5px;color:var(--ink2)}
kbd{font:700 11px/1 var(--f-m);padding:3px 6px;border-radius:6px;border:1.5px solid var(--ink);background:var(--card);box-shadow:1px 1px 0 var(--ink)}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.hud>div{padding:8px 12px;border-radius:14px;background:var(--paper);border:2px solid var(--ink);min-width:0}
.hud .lab{display:block;font:700 9.5px/1.2 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud b{font:800 20px/1.2 var(--f-d);font-variant-numeric:tabular-nums}
.hud small{font-size:11px;color:var(--ink2);margin-left:3px}
.hud .gfill{background:var(--g);color:#fff}
.hud .gfill .lab{color:rgba(255,255,255,.85)}
@media (max-width:620px){.hud b{font-size:16px}.hud>div{padding:6px 9px}}
.cv-wrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--ink)}
.cv-wrap canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:none}
.over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:800 clamp(56px,13vw,130px)/1 var(--f-d);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);opacity:0;transition:opacity .15s}
.over.show{opacity:1}
.over.pop{animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.4)}to{transform:none}}
.over.fin{display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;background:rgba(251,248,243,.55)}
.over.fin span{font-size:clamp(16px,2.4vw,22px);letter-spacing:.2em;text-transform:uppercase;-webkit-text-stroke:0;text-shadow:none;color:var(--ink)}
.over.fin b{font-size:clamp(40px,8vw,76px)}
.touchpad{display:none;grid-template-columns:1fr 1fr 1fr;gap:10px}
.touchpad button{height:66px;border-radius:18px;border:2px solid var(--ink);background:var(--card);box-shadow:var(--sh);font:800 16px/1 var(--f-d);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.touchpad button.on{background:var(--g);color:#fff;transform:translate(3px,3px);box-shadow:none}
@media (pointer:coarse),(max-width:720px){.touchpad{display:grid}}
.floaty{position:fixed;z-index:75;pointer-events:none;font:800 22px/1 var(--f-d);color:var(--fc,var(--ink));-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink);animation:floaty .9s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes floaty{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:74}
.combo{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;border:2px solid var(--ink);background:var(--sun);font:800 13px/1 var(--f-d)}
.combo.off{background:var(--wash);color:var(--mute);border-color:var(--line2)}
.combo.bump{animation:bump .25s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{from{transform:scale(1.35)}to{transform:none}}
.rivalbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;border:2px dashed var(--line2);background:var(--paper);font-size:13px}
.rivalbar b{font-family:var(--f-m)}

/* reflex */
.rx{display:flex;flex-direction:column;gap:14px}
.rx-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rounds{display:flex;gap:6px;flex-wrap:wrap}
.rounds span{min-width:66px;padding:7px 8px;border-radius:11px;background:var(--paper);border:2px solid var(--line2);font:700 12px/1.2 var(--f-m);text-align:center;color:var(--mute)}
.rounds span.done{color:var(--ink);border-color:var(--ink);background:var(--card)}
.rounds span.cur{border-color:var(--ink);background:var(--sun);color:var(--ink)}
.rx-pad{position:relative;overflow:hidden;width:100%;min-height:clamp(280px,46vh,440px);border-radius:24px;border:2px solid var(--ink);box-shadow:var(--sh2);background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:20px;text-align:center}
.rx-pad>*{position:relative;z-index:1}
.rx-pad.wait{background:#E9E6FF}
.rx-pad.wait::before,.rx-pad.wait::after{content:"";position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:3px solid var(--brand);opacity:0;animation:ring 1.6s ease-out infinite}
.rx-pad.wait::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(.4);opacity:.7}to{transform:scale(3);opacity:0}}
.rx-pad.decoy{background:#8FD3FF}
.rx-pad.go{background:var(--c-reflex);color:#fff}
.rx-pad.false{background:var(--bad-soft)}
.rx-pad.done{background:var(--good-soft)}
.rx-big{font:800 clamp(40px,8vw,76px)/1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rx-small{font-size:15px;max-width:44ch;font-weight:500}
.rx-opp{display:flex;align-items:center;gap:10px;font-size:13px}

/* brain */
.bb{display:flex;flex-direction:column;gap:14px}
.bb-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.bb-score .side{display:flex;align-items:center;gap:10px;min-width:0}
.bb-score .side.op{justify-content:flex-end;text-align:right}
.bb-score small{display:block;color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-score b{font:800 26px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.bb-q{padding:7px 12px;border-radius:11px;background:var(--ink);color:#fff;font-size:12px}
.bb-timer{height:14px;border-radius:99px;background:var(--wash);border:2px solid var(--ink);overflow:hidden}
.bb-timer i{display:block;height:100%;width:100%;background:var(--c-brain)}
.bb-timer i.warn{background:var(--bad)}
.bb-card{display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:22px;background:var(--c-brain);color:#fff;border:2px solid var(--ink);box-shadow:var(--sh)}
.bb-card h2{font-size:clamp(19px,2.6vw,26px);line-height:1.25}
.bb-card .pill{background:#fff;color:var(--ink);border-color:var(--ink)}
.bb-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.bb-opts{grid-template-columns:1fr}}
.bb-opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;border-radius:16px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font-weight:700;box-shadow:var(--sh);transition:transform .08s,box-shadow .08s}
.bb-opt:hover:not([disabled]){background:var(--sun)}
.bb-opt:active:not([disabled]){transform:translate(3px,3px);box-shadow:none}
.bb-opt .key{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;font-size:12px;flex:none}
.bb-opt.right{background:#B8F2D9}
.bb-opt.wrong{background:#FFC2CA}
.bb-opt[disabled]{cursor:default}
.bb-os{font-size:13.5px;min-height:1.5em;color:rgba(255,255,255,.92)}

/* cards */
.cc{display:flex;flex-direction:column;gap:14px}
.cc-rules{border-radius:16px;background:var(--paper);border:2px solid var(--line2);padding:12px 16px}
.cc-rules summary{cursor:pointer;font-weight:800;font-family:var(--f-d)}
.cycle{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font:700 12px/1.3 var(--f-m);color:var(--ink2);align-items:center}
.cycle span{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:8px;color:#fff}
.cc-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.cc-bar>div:last-child{text-align:right}
.cc-bar small{display:block;color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-bar b{font:800 28px/1 var(--f-d)}
.cc-hand{display:grid;grid-template-columns:repeat(5,minmax(0,92px));gap:10px;justify-content:center}
.cc-table{display:grid;grid-template-columns:minmax(0,108px) minmax(0,1fr) minmax(0,108px);gap:12px;align-items:center;padding:18px;border-radius:22px;background:#FFF4CC;border:2px solid var(--ink)}
.slot{aspect-ratio:5/7;border-radius:14px;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--mute);font-size:11px;text-align:center;padding:6px;background:rgba(255,255,255,.5)}
.slot .ccard{width:100%}
.cc-msg{text-align:center;font:800 16px/1.3 var(--f-d)}
.cc-msg small{display:block;font:500 12.5px/1.4 var(--f-b);color:var(--ink2);margin-top:6px}
.cc-ctrl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
.ccard{--c:var(--c-sprint);width:100%;aspect-ratio:5/7;border-radius:14px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;background:var(--c);border:2px solid var(--ink);color:#fff;text-align:left;min-width:0;box-shadow:3px 3px 0 var(--ink);position:relative}
.ccard .el{display:flex;align-items:center;gap:4px;font:700 9.5px/1 var(--f-m);letter-spacing:.05em;text-transform:uppercase}
.ccard .el svg{width:14px;height:14px;flex:none}
.ccard .pw{font:800 clamp(28px,5.5vw,40px)/1 var(--f-d);align-self:center;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.ccard .ft{height:6px;border-radius:99px;background:rgba(255,255,255,.55)}
.ccard .oc{position:absolute;top:-9px;right:-9px;padding:3px 6px;border-radius:8px;border:2px solid var(--ink);background:var(--sun);color:var(--ink);font:800 11px/1 var(--f-d)}
button.ccard{cursor:pointer;transition:transform .15s,box-shadow .15s}
button.ccard:hover:not([disabled]){transform:translateY(-8px) rotate(-2deg);box-shadow:4px 8px 0 var(--ink)}
button.ccard[disabled]{opacity:.5;cursor:default}
.ccard.back{background:repeating-linear-gradient(45deg,var(--ink) 0 7px,#2C2745 7px 14px)}
.ccard.back .el{opacity:1}
.ccard.back .pw{color:var(--sun)}
.ccard.win{outline:4px solid var(--good);outline-offset:2px}
.ccard.flip{animation:flip .35s ease}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.ccard.land{animation:land .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes land{from{transform:translateY(40px) scale(.8)}to{transform:none}}

/* stack */
.st-wrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.st-wrap .cv-wrap{width:min(100%,460px);cursor:pointer}

/* grid lock */
.gl{display:flex;flex-direction:column;gap:14px;align-items:center}
.gl-board{display:grid;gap:8px;width:min(100%,430px);padding:12px;border-radius:22px;background:var(--paper);border:2px solid var(--ink)}
.gl-cell{aspect-ratio:1;border-radius:14px;border:2px solid var(--ink);background:var(--card);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:background .15s,transform .15s,box-shadow .1s;display:grid;place-items:center;padding:0}
.gl-cell.on{background:var(--c-grid);box-shadow:3px 3px 0 var(--ink),inset 0 0 0 4px rgba(255,255,255,.35)}
.gl-cell.on::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(255,255,255,.75)}
.gl-cell.flip{animation:cellflip .22s ease}
@keyframes cellflip{50%{transform:scale(.82) rotate(6deg)}}
.gl-cell.cur{outline:3px solid var(--brand);outline-offset:3px}
.gl-cell:active{transform:translate(3px,3px);box-shadow:none}
.gl-board.solved .gl-cell{animation:solved .5s ease}
@keyframes solved{40%{transform:scale(1.08)}}

/* words */
.wr{display:flex;flex-direction:column;gap:14px;align-items:center}
.wr-cat{font:800 14px/1 var(--f-d);padding:8px 14px;border-radius:12px;background:var(--c-words);color:#fff;border:2px solid var(--ink)}
.wr-slots,.wr-tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wr-slot,.wr-tile{width:clamp(40px,10vw,58px);aspect-ratio:1;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font:800 clamp(20px,4.5vw,28px)/1 var(--f-d);padding:0}
.wr-slot{background:var(--paper);border-style:dashed;border-color:var(--line2);color:var(--ink)}
.wr-slot.fill{border-style:solid;border-color:var(--ink);background:var(--card);cursor:pointer;animation:land .2s cubic-bezier(.2,1.6,.4,1)}
.wr-slot.lock{background:var(--sun)}
.wr-tile{background:var(--c-words);color:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.wr-tile:active{transform:translate(3px,3px);box-shadow:none}
.wr-tile.used{visibility:hidden}
.wr-slots.good .wr-slot{background:#B8F2D9;border-color:var(--ink)}
.wr-slots.badw .wr-slot.fill{background:#FFC2CA}
.wr-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.wr-found{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:640px}
.wr-found span{font:700 11.5px/1 var(--f-m);padding:5px 8px;border-radius:8px;background:var(--good-soft);border:1.5px solid var(--good);color:var(--good)}
.wr-found span.skip{background:var(--wash);border-color:var(--line2);color:var(--mute);text-decoration:line-through}

/* ---------- misc pages ---------- */
.tier{display:flex;flex-direction:column;gap:12px}
.tier .price{font:800 28px/1 var(--f-d)}
.tier .price small{font:500 12px var(--f-b);color:var(--ink2)}
.tier li{display:flex;gap:8px;font-size:14px;margin-top:6px}
.tier li .ic{color:var(--good);margin-top:2px}
.tier.feat{background:var(--sun);border:2px solid var(--ink);box-shadow:var(--sh)}
.arch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.arch{grid-template-columns:1fr}}
.arch .box{padding:12px 14px;border-radius:14px;border:2px solid var(--line2);background:var(--paper);font-size:13px}
.arch .box b{display:block;font:800 13.5px/1.3 var(--f-d);margin-bottom:4px}
.arch .box.real{border-color:var(--ink);background:var(--good-soft)}
.arch .box.fut{border-style:dashed}
.prose{max-width:68ch;color:var(--ink2);font-size:14.5px;display:flex;flex-direction:column;gap:10px}
.prose b{color:var(--ink)}
.list li{display:flex;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line);font-size:14px;align-items:flex-start}
.list li:first-child{border-top:0;padding-top:0}
.list li .ic{margin-top:2px;flex:none}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px}
.choice button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:2px solid var(--line2);background:var(--card);cursor:pointer;font-size:11.5px;color:var(--ink2);font-weight:600}
.choice button:hover:not([disabled]){border-color:var(--ink)}
.choice button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--brand-soft);box-shadow:2px 2px 0 var(--ink)}
.choice button[disabled]{opacity:.45;cursor:not-allowed}
.hist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1.5px dashed var(--line)}
.hist li:first-child{border-top:0}

/* ---------- overlays ---------- */
#layer:empty{display:none}

@keyframes fade{from{opacity:0}}
.modal{width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:16px;animation:popin .25s cubic-bezier(.2,1.4,.4,1)}

.panel{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:22px;z-index:60;width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 var(--ink)}
.scrim{position:fixed;inset:0;z-index:59}

.ntf li:first-child{border-top:0}
.ntf li.unread::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--hot);border:1.5px solid var(--ink);margin-top:6px;flex:none}
.ntf li small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
@media (max-width:600px){
  .layer{place-items:end center;padding:0}
  .modal{border-radius:26px 26px 0 0;max-height:88vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));box-shadow:none}
  .panel{right:16px;left:16px;width:auto}
}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,16px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--sun);transition:opacity .2s,transform .2s}
