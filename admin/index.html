<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>RYVO Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Layout: RYVO's sticker identity turned into an operations console. Ink rail, paper ground, dense tables, colour only where something needs a decision. Single light theme. */
  color-scheme:light;
  --paper:#FBF8F3; --wash:#F3EEE6; --card:#FFFFFF; --ink:#17142A; --ink2:#4A4560; --mute:#7C7792; --line:#E8E2D8; --line2:#D3CCBF;
  --brand:#5B4BFF; --brand-soft:#ECEAFF; --sun:#FFC93C; --sun-soft:#FFF4CC; --hot:#FF6B3D;
  --good:#0E9F64; --good-soft:#DDF5EA; --warn:#B45309; --warn-soft:#FFEDD5; --bad:#E5364B; --bad-soft:#FDE3E6;
  --c-sprint:#3D7BFF; --c-reflex:#FF6B3D; --c-brain:#8B5CF6; --c-cards:#FFB800; --c-stack:#FF4FA0; --c-grid:#14B37A; --c-words:#00A6C8; --c-aim:#F23F55;
  --f-d:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --f-b:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
#main:focus{outline:none}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;font-weight:800}
h3{font-size:14px;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.tiny{font-size:12px;color:var(--ink2)}
.mute{color:var(--mute)}
.eyebrow{font:700 10.5px/1.3 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ic{flex:none}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ink);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px;font:800 21px/1 var(--f-d);letter-spacing:-.01em}
.logo small{display:block;font:700 9px/1 var(--f-m);letter-spacing:.14em;color:var(--sun);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font:700 9.5px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:12px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:none;color:rgba(255,255,255,.78);font-weight:600;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:var(--ink)}
.nav button .cnt{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:99px;background:var(--hot);color:#fff;font:700 10.5px/20px var(--f-m);text-align:center}
.nav button .lk{margin-left:auto;opacity:.6}
.nav button[disabled]{opacity:.45;cursor:not-allowed}
.rail-foot{margin-top:auto;font-size:11.5px;color:rgba(255,255,255,.6);line-height:1.45;padding:0 6px}
main{min-width:0;padding-inline:28px;padding-block:0 60px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:12px;background:linear-gradient(var(--paper) 78%,transparent)}
#top .grow{flex:1}
.demo-band{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:2px dashed #E3B341;background:#FFF9E6;font-size:12.5px;color:#7A4E00;margin-bottom:18px}
.who{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:2px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:2px 2px 0 var(--ink)}
.who .av{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 13px/1 var(--f-d);border:2px solid var(--ink)}
.who select{border:0;background:none;font-weight:700;cursor:pointer;padding:2px}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #rail{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:12px;overflow-x:auto}
  #rail .nav{flex-direction:row;gap:4px}
  #rail .nav .grp,.rail-foot{display:none}
  #rail .nav button{white-space:nowrap;padding:8px 10px}
  .logo small{display:none}
  main{padding-inline:16px}
  #top{position:static}
}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
.page-h p{color:var(--ink2);margin-top:6px;max-width:66ch}
.page-h>div{min-width:0;max-width:100%}
.page-h .row{flex-wrap:nowrap}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1200px){.c3,.c4{grid-column:span 6}.c5,.c7,.c8{grid-column:span 12}}
@media (max-width:720px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.card{background:var(--card);border:1.5px solid var(--line2);border-radius:18px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line2);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font:800 26px/1.05 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi small{color:var(--ink2);font-size:12px;font-weight:600}
.kpi .d{font:700 11.5px/1 var(--f-m);color:var(--mute)}
.kpi.alert{border:2px solid var(--ink);background:var(--sun-soft);box-shadow:3px 3px 0 var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:11px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 13px/1 var(--f-b);cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--wash)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.primary{background:var(--brand);color:#fff}
.btn.sun{background:var(--sun)}
.btn.danger{background:var(--bad);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--wash)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font:700 10px/1 var(--f-m);letter-spacing:.04em;text-transform:uppercase;border:1.5px solid var(--line2);color:var(--ink2);background:var(--card);white-space:nowrap}
.badge.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:var(--good-soft)}
.badge.warn{color:var(--warn);border-color:#F4B37F;background:var(--warn-soft)}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.badge.brand{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent);background:var(--brand-soft)}
.badge.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge.sim{border-style:dashed;color:#8A5A00;border-color:#E3B341;background:#FFF7DD}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tabs{display:inline-flex;padding:4px;gap:4px;border-radius:13px;background:var(--wash);border:2px solid var(--ink);max-width:100%;overflow-x:auto}
.tabs button{height:32px;padding:0 12px;border-radius:9px;border:0;background:none;color:var(--ink2);font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.tabs button .n{margin-left:6px;font:700 10px var(--f-m);opacity:.8}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-weight:700;font-size:12.5px}
.field .help{font-size:11.5px;color:var(--mute)}
.field .err{font-size:12px;color:var(--bad);font-weight:600}
.input{height:38px;padding:0 12px;border-radius:10px;border:2px solid var(--line2);background:var(--card);width:100%;min-width:0}
textarea.input{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
textarea.code{font:12px/1.5 var(--f-m);min-height:280px}
.input:focus{outline:none;border-color:var(--ink);box-shadow:3px 3px 0 var(--brand)}
.input.bad{border-color:var(--bad)}
.search{position:relative;flex:1;min-width:200px}
.search .input{padding-left:34px}
.search .ic{position:absolute;left:10px;top:10px;color:var(--mute)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.fgrid{grid-template-columns:1fr}}
.fgrid .full{grid-column:1/-1}
.switch{position:relative;display:inline-block;width:40px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line2);border:2px solid var(--ink);transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);transition:transform .15s}
.switch input:checked+i{background:var(--good)}
.switch input:checked+i::after{transform:translateX(16px)}
.switch input:focus-visible+i{outline:3px solid var(--brand);outline-offset:2px}

.tblw{overflow-x:auto;border:1.5px solid var(--line2);border-radius:14px;background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--wash);text-align:left;font:700 10.5px/1.2 var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:10px 12px;white-space:nowrap;border-bottom:1.5px solid var(--line2)}
.tbl th button{all:unset;cursor:pointer}
.tbl th button:hover{color:var(--ink)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FDFBF7}
.tbl tr.click{cursor:pointer}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums}
.tbl td .sub{display:block;color:var(--mute);font-size:11.5px}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl tr.sel td{background:var(--brand-soft)}
.player{display:flex;align-items:center;gap:10px;min-width:0}
.pav{width:32px;height:32px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font:800 13px/1 var(--f-d);flex:none}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px;border:2px dashed var(--line2);border-radius:16px;color:var(--ink2);background:var(--paper)}
.empty b{color:var(--ink);font-family:var(--f-d);font-size:15px}
.queue li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1.5px dashed var(--line)}
.queue li:first-child{border-top:0;padding-top:0}
.qico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--sun);flex:none}
.qico.bad{background:#FFC2CA}.qico.brand{background:var(--brand-soft)}.qico.good{background:#B8F2D9}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.log li:first-child{border-top:0}
.log li time{font:600 11px/1.6 var(--f-m);color:var(--mute);white-space:nowrap}
.log li b{font-weight:700}
.report{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px;border:1.5px solid var(--line2);border-radius:14px;background:var(--card)}
.report.done{opacity:.6}
.report blockquote{margin:6px 0 0;padding:8px 12px;border-left:3px solid var(--ink);background:var(--paper);border-radius:0 8px 8px 0;font-size:13px}
.report .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
@media (max-width:700px){.report{grid-template-columns:1fr}.report .acts{flex-direction:row;flex-wrap:wrap}}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr) 120px;gap:12px;align-items:center;padding:10px 0;border-top:1.5px dashed var(--line)}
.rule:first-child{border-top:0}
.rule b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:9px;border:1.5px solid var(--line2);background:var(--card);font:700 12px/1 var(--f-m)}
.wchip small{font:500 11px var(--f-b);color:var(--mute)}
.wchip button{border:0;background:none;cursor:pointer;color:var(--mute);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.wchip button:hover{background:var(--bad-soft);color:var(--bad)}
.wchip.warn{border-color:#F4B37F;background:var(--warn-soft)}
.perm td{text-align:center}
.perm td:first-child{text-align:left;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--ink)}
.chart text{fill:var(--ink2);font:600 10px var(--f-m)}
.chart .gl line{stroke:var(--line);stroke-width:1}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px;margin-top:6px}
.bar{height:10px;border-radius:99px;background:var(--wash);border:1px solid var(--line2);overflow:hidden}
.bar i{display:block;height:100%}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:900px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
.day{border:1.5px solid var(--line2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.day b{font:800 13px/1.2 var(--f-d)}
.day .input{height:34px;font-size:12.5px;padding:0 8px}

/* drawer & modal */
#layer:empty{display:none}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(23,20,42,.42);animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(480px,100vw);background:var(--card);border-left:2px solid var(--ink);box-shadow:-8px 0 0 rgba(23,20,42,.12);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;animation:slide .2s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:61;width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border:2px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px}
.m-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.m-h p{color:var(--ink2);font-size:13px;margin-top:4px}
.x{width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
dl.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--ink2)} dl.kv dd{margin:0;text-align:right;font:600 12.5px/1.4 var(--f-m)}
.section{border-top:1.5px dashed var(--line2);padding-top:14px;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;transform:translate(-50%,14px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);padding:11px 15px;border-radius:13px;background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;box-shadow:4px 4px 0 var(--sun);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.denied{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:60px 20px;border:2px dashed var(--line2);border-radius:20px;background:var(--card)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <aside id="rail"></aside>
  <main>
    <header id="top"></header>
    <div id="main" tabindex="-1"></div>
  </main>
</div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script>
(function(){
'use strict';
/* ========================= utils ========================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const eur=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const DAY=864e5;let NOW=Date.now();
const dShort=ts=>new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const dLong=ts=>new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const dTime=ts=>new Date(ts).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function ago(ts){const s=Math.max(1,Math.round((Date.now()-ts)/1000));if(s<60)return 'il y a '+s+' s';const m=Math.round(s/60);if(m<60)return 'il y a '+m+' min';const h=Math.round(m/60);if(h<24)return 'il y a '+h+' h';const d=Math.round(h/24);return 'il y a '+d+' j';}
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
const sorted=s=>s.split('').sort().join('');

const ICONS={

/* ---------- authentification + double authentification ---------- */
async function afterLogin(){
  S.auth={stage:'loading'};render();
  try{
    const me=await rpc('admin_me');S.me=me;
    if(!me.role){S.auth={stage:'forbidden'};render();return;}
    if(me.require_mfa&&!me.mfa_ok){await mfaFlow();return;}
    S.role=me.role;S.auth={stage:'ready'};
    try{S.schools=(await rpc('public_info')).schools||[];}catch(e){}
    if(!can(S.ui.sec))S.ui.sec='overview';
    refreshCounts();loadSection();
  }catch(e){S.auth={stage:'login',err:errText(e)};render();}
}
async function mfaFlow(){
  try{
    const {data,error}=await sb.auth.mfa.listFactors();if(error)throw error;
    const ok=(data.totp||[]).filter(f=>f.status==='verified');
    if(ok.length){S.auth={stage:'challenge',factorId:ok[0].id};render();return;}
    for(const f of (data.all||[]).filter(f=>f.status!=='verified'))await sb.auth.mfa.unenroll({factorId:f.id});
    const en=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'RYVO Admin '+new Date().toISOString().slice(0,10)});if(en.error)throw en.error;
    S.auth={stage:'enroll',factorId:en.data.id,qr:en.data.totp.qr_code,secret:en.data.totp.secret};render();
  }catch(e){S.auth={stage:'login',err:'Double authentification : '+errText(e)};render();}
}

  const W=640,H=200,pl=36,pr=12,pt=14,pb=26,max=Math.max(5,Math.ceil(Math.max(...series.map(s=>s[1]),0)/5)*5);
  const x=i=>pl+i*(W-pl-pr)/Math.max(1,series.length-1),y=v=>pt+(H-pt-pb)*(1-v/max);
  const path=series.map((s,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(s[1]).toFixed(1)).join(' '),last=series[series.length-1]||[Date.now(),0];
  const chart=series.length?`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Joueurs actifs par jour sur 30 jours, dernier jour ${last[1]}" style="width:100%;height:auto">
    <g class="gl">${[0,max/2,max].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${fmt(t)}</text>`).join('')}</g>
    <path d="${path} L${x(series.length-1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="#ECEAFF"/><path d="${path}" fill="none" stroke="#17142A" stroke-width="2.5" stroke-linejoin="round"/>
    ${series.map((s,i)=>(i%7===0&&i<series.length-4)||i===series.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="${i===series.length-1?'end':'middle'}">${dShort(s[0])}</text>`:'').join('')}
    <circle cx="${x(series.length-1)}" cy="${y(last[1])}" r="5" fill="#FFC93C" stroke="#17142A" stroke-width="2"/><text x="${x(series.length-1)-8}" y="${y(last[1])-10}" text-anchor="end" style="fill:#17142A;font-weight:700">${last[1]}</text></svg>`:'';
  const games=(o.plays||[]).slice().sort((a,b)=>b.plays-a.plays),gmax=Math.max(1,...games.map(g=>g.plays));
  const q=[];
  if(c.reports)q.push(['flag','bad',`${c.reports} signalement${c.reports>1?'s':''} ouvert${c.reports>1?'s':''}`,'Pseudos, triche, usurpation','moderation']);
  if(c.flags)q.push(['shield','',`${c.flags} score${c.flags>1?'s':''} suspect${c.flags>1?'s':''}`,'Détectés par les règles anti-triche','anticheat']);
  if(c.verifs)q.push(['campus','brand',`${c.verifs} vérification${c.verifs>1?'s':''} d’école`,'Étudiants en attente de badge','schools']);
  if(c.late)q.push(['euro','bad',`${c.late} facture${c.late>1?'s':''} en retard`,'À relancer','business']);
  if(c.drafts)q.push(['book','good',`${c.drafts} question${c.drafts>1?'s':''} en brouillon`,'À relire et publier','content']);
  const vq=q.filter(x=>can(x[4]));
  return head('Vue d’ensemble','Bonjour '+esc((S.me||{}).name||''),'Ce qui demande une décision, puis l’état de la plateforme. Données réelles.')+`
  <div class="kpis" style="margin-bottom:16px">
    <div class="kpi"><small>Joueurs inscrits</small><b>${fmt(o.players)}</b><span class="d">${o.new7} cette semaine</span></div>
    <div class="kpi"><small>Actifs · 7 jours</small><b>${fmt(o.active7)}</b><span class="d">${o.players?Math.round(o.active7/o.players*100):0} % des inscrits</span></div>
    <div class="kpi"><small>Actifs · 30 jours</small><b>${fmt(o.active30)}</b><span class="d">${o.verified} étudiants vérifiés</span></div>
    <div class="kpi"><small>Abonnés Plus</small><b>${fmt(o.plus)}</b><span class="d">${eur(o.plus*(o.plus_price||0))} / mois</span></div>
    <div class="kpi ${vq.length?'alert':''}"><small>Décisions en attente</small><b>${(c.reports||0)+(c.flags||0)+(c.verifs||0)}</b><span class="d">modération, triche, écoles</span></div>
  </div>
  <div class="grid">
    <section class="card c5"><div class="card-h"><h2>À traiter</h2></div>
      ${vq.length?`<ul class="queue">${vq.map(x=>`<li><span class="qico ${x[1]}">${ic(x[0])}</span><span><b>${x[2]}</b><span class="tiny" style="display:block">${x[3]}</span></span><button class="btn sm" type="button" data-act="sec" data-a="${x[4]}">Ouvrir</button></li>`).join('')}</ul>`:`<div class="empty"><b>Rien en attente</b>Toutes les files sont vides.</div>`}
    </section>
    <section class="card c7"><div class="card-h"><h2>Joueurs actifs par jour</h2><span class="tiny">30 derniers jours</span></div>${chart||'<div class="empty"><b>Pas encore de données</b></div>'}</section>
    <section class="card c5"><div class="card-h"><h2>Jeux les plus joués</h2><span class="tiny">Parties sur 7 jours</span></div>
      ${games.map(g=>{const G=GM(g.id);return `<div class="hbar"><span>${G.name}</span><div class="bar"><i style="width:${g.plays/gmax*100}%;background:${G.col}"></i></div><span class="mono tiny" style="text-align:right">${fmt(g.plays)}</span></div>`;}).join('')}
    </section>
    <section class="card c7"><div class="card-h"><h2>Activité récente de l’équipe</h2>${can('team')?'<button class="btn sm ghost" type="button" data-act="sec" data-a="team">Journal complet</button>':''}</div>${logList(o.log)}</section>
  </div>`;
};

/* ========================= players ========================= */
V.players=()=>{
  const f=S.ui.pl;
  return head('Communauté','Joueurs','Cherche un compte, ouvre sa fiche pour agir. Chaque action est inscrite au journal d’audit.')+`
  <div class="filters" style="margin-bottom:12px">
    <div class="search">${ic('search',16)}<input class="input" id="plq" data-in="plq" value="${esc(f.q)}" placeholder="Pseudo, identifiant ou e-mail" autocomplete="off" aria-label="Rechercher un joueur"></div>
    <div class="field"><label for="pls">Statut</label><select class="input" id="pls" data-ch="pls"><option value="all">Tous</option><option value="active" ${f.status==='active'?'selected':''}>Actifs</option><option value="suspended" ${f.status==='suspended'?'selected':''}>Suspendus</option><option value="banned" ${f.status==='banned'?'selected':''}>Bannis</option></select></div>
    <div class="field"><label for="plsc">École</label><select class="input" id="plsc" data-ch="plsc"><option value="all">Toutes</option>${S.schools.map(s=>`<option value="${s.id}" ${f.school===s.id?'selected':''}>${esc(s.short)}</option>`).join('')}</select></div>
    <div class="field"><label for="plv">Vérifié</label><select class="input" id="plv" data-ch="plv"><option value="all">Tous</option><option value="yes" ${f.ver==='yes'?'selected':''}>Oui</option><option value="no" ${f.ver==='no'?'selected':''}>Non</option></select></div>
  </div><div id="plTable">${playersTable()}</div>`;
};
function playersTable(){
  const f=S.ui.pl,d=S.d.plist;if(!d)return loading();
  const th=(k,l,cls='')=>`<th class="${cls}"><button type="button" data-act="sort" data-a="${k}">${l}${f.sort===k?(f.dir>0?' ↑':' ↓'):''}</button></th>`;
  if(!d.total)return `<div class="empty"><b>${f.q||f.status!=='all'||f.school!=='all'||f.ver!=='all'?'Aucun joueur ne correspond':'Aucun joueur inscrit pour l’instant'}</b>${f.q||f.status!=='all'||f.school!=='all'||f.ver!=='all'?'<button class="btn sm" type="button" data-act="plReset">Réinitialiser les filtres</button>':'Les comptes apparaîtront ici dès les premières inscriptions.'}</div>`;
  const pages=Math.max(1,Math.ceil(d.total/20));
  return `<div class="tblw"><table class="tbl"><thead><tr>${th('name','Joueur')}<th>École</th>${th('level','Niveau','num')}${th('rating','Cote','num')}${th('matches','Parties','num')}${th('last','Dernière activité')}<th>Statut</th>${th('reports','Signal.','num')}</tr></thead><tbody>
    ${d.rows.map(p=>{const s=SC(p.school);return `<tr class="click" data-act="player" data-a="${p.id}" tabindex="0"><td><span class="player">${pav(p)}<span style="min-width:0"><b>${esc(p.name)}</b>${p.plus?' <span class="badge brand">Plus</span>':''}<span class="sub">${esc(p.mail||'')}</span></span></span></td>
      <td>${s?esc(s.short):'—'}${p.verified?' <span class="badge good">vérifié</span>':''}</td><td class="num">${p.level}</td><td class="num">${fmt(p.rating)}</td><td class="num">${fmt(p.matches)}</td><td>${ago(p.last)}</td><td>${statusBadge(p)}</td><td class="num">${p.reports?`<span class="badge bad">${p.reports}</span>`:'0'}</td></tr>`;}).join('')}
  </tbody></table></div>
  <div class="pager"><span class="tiny">${fmt(d.total)} joueur${d.total>1?'s':''} · page ${f.page+1} / ${pages}</span><span class="row"><button class="btn sm" type="button" data-act="page" data-a="-1" ${f.page<=0?'disabled':''}>Précédent</button><button class="btn sm" type="button" data-act="page" data-a="1" ${f.page>=pages-1?'disabled':''}>Suivant</button></span></div>`;
}
function playerDrawer(){
  const p=S.d.player;
  if(!p)return `<div class="m-h"><h2>Chargement…</h2><button class="x" type="button" data-act="close" aria-label="Fermer">${ic('x')}</button></div>${loading()}`;
  const s=SC(p.school),ro=!['super','mod'].includes(S.role),rev=S.ui.reveal[p.id];
  return `<div class="m-h"><div class="player">${pav(p,48)}<div><h2>${esc(p.name)}</h2><div class="row" style="margin-top:6px">${statusBadge(p)}${p.verified?'<span class="badge good">Étudiant vérifié</span>':'<span class="badge">Non vérifié</span>'}${p.plus?'<span class="badge brand">Plus</span>':''}</div></div></div><button class="x" type="button" data-act="close" aria-label="Fermer">${ic('x')}</button></div>
  <dl class="kv">
    <dt>Identifiant</dt><dd>${esc(String(p.id).slice(0,8))}…</dd>
    <dt>E-mail</dt><dd>${esc(rev||p.mail||'')} ${rev?'':`<button class="btn sm ghost" type="button" data-act="reveal" data-a="${p.id}">${ic('eye',14)}Afficher</button>`}</dd>
    <dt>École</dt><dd>${s?esc(s.name):'—'}</dd><dt>Année</dt><dd>${esc(YEARS[p.year]||'—')}</dd>
    <dt>Inscrit le</dt><dd>${dLong(p.joined)}</dd><dt>Dernière activité</dt><dd>${ago(p.last)}</dd>
    <dt>Niveau · cote</dt><dd>${p.level} · ${fmt(p.rating)} SR</dd><dt>Parties</dt><dd>${fmt(p.matches)}</dd>
  </dl>
  <p class="tiny">${ic('info',14)} L’adresse complète est masquée par défaut. L’afficher est inscrit au journal.</p>
  ${p.runs&&p.runs.length?`<div class="section"><h3>Dernières parties</h3><div class="tblw"><table class="tbl"><tbody>${p.runs.map(r=>`<tr><td>${esc(skLabel(r.sk))}</td><td class="num">${fmtScore(r.sk,r.s)}</td><td><span class="badge ${r.st==='valid'?'good':r.st==='flagged'?'warn':r.st==='void'?'bad':''}">${r.st}</span></td><td>${ago(r.t)}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  ${p.reports_list&&p.reports_list.length?`<div class="section"><h3>Signalements (${p.reports_list.length})</h3>${p.reports_list.map(r=>`<p class="tiny"><span class="badge ${r.status==='open'?'bad':''}">${r.status==='open'?'ouvert':esc(r.res||'traité')}</span> ${esc(r.type)} · ${ago(r.t)} : « ${esc(r.text)} »</p>`).join('')}</div>`:''}
  ${ro?'<div class="section"><p class="tiny">Ce rôle peut consulter mais pas sanctionner.</p></div>':`
  <div class="section"><h3>Renommer</h3><p class="tiny">À utiliser pour un pseudo inapproprié ou une usurpation.</p>
    <div class="row"><input class="input" id="dRename" maxlength="16" value="${esc(p.name)}" style="flex:1;min-width:160px" aria-label="Nouveau pseudo"><button class="btn" type="button" data-act="pAct" data-a="rename">Renommer</button></div></div>
  <div class="section"><h3>Sanction</h3>
    ${p.status==='active'?`<div class="fgrid"><div class="field"><label for="dDur">Durée</label><select class="input" id="dDur"><option value="1">24 heures</option><option value="7" selected>7 jours</option><option value="30">30 jours</option></select></div>
      <div class="field"><label for="dMot">Motif</label><select class="input" id="dMot">${MOTIFS.map(m=>`<option>${m}</option>`).join('')}</select></div></div>
      <div class="row"><button class="btn sun" type="button" data-act="pAct" data-a="suspend">Suspendre</button><button class="btn danger" type="button" data-act="askBan">Bannir…</button></div>`
     :`<div class="row"><button class="btn good" type="button" data-act="pAct" data-a="lift">${p.status==='banned'?'Lever le bannissement':'Lever la suspension'}</button></div>`}
  </div>
  <div class="section"><h3>Vérification école</h3><div class="row"><button class="btn sm" type="button" data-act="pAct" data-a="${p.verified?'unverify':'verify'}">${p.verified?'Retirer la vérification':'Marquer comme vérifié'}</button></div></div>
  <div class="section"><h3>Scores</h3><div class="row"><button class="btn" type="button" data-act="askResetScores">${ic('refresh',15)}Réinitialiser ses scores…</button></div></div>`}
  <div class="section"><h3>Notes internes</h3><textarea class="input" id="dNotes" placeholder="Visible uniquement par l’équipe" ${ro?'readonly':''}>${esc(p.notes||'')}</textarea>${ro?'':`<div class="row"><button class="btn sm" type="button" data-act="pAct" data-a="note">Enregistrer la note</button></div>`}</div>
  <div class="section"><h3>Historique des actions</h3>${logList(p.log)}</div>`;
}

/* ========================= moderation ========================= */
V.moderation=()=>{
  const list=S.d.reports,c=S.counts||{};
  return head('Communauté','Signalements','Les joueurs signalent un pseudo, une triche ou un comportement.',tabs(S.ui.mod,'modTab',[['open','Ouverts',c.reports],['done','Traités',null]]))+
  (!list?loading():list.length?`<div class="stack">${list.map(r=>{const t=r.target;return `<article class="report ${r.status!=='open'?'done':''}"><div style="min-width:0">
      <div class="row"><span class="badge ${/Triche/.test(r.type)?'bad':/Usurpation/.test(r.type)?'warn':''}">${esc(r.type)}</span><span class="tiny">${ago(r.t)} · signalé par ${esc(r.reporter)}</span>${r.status!=='open'?`<span class="badge good">${esc(r.res||'')}</span>`:''}</div>
      <p style="margin-top:8px"><button class="btn sm ghost" type="button" data-act="player" data-a="${t.id}" style="padding:0 6px">${pav(t,22)} <b>${esc(t.name)}</b></button> ${statusBadge(t)} <span class="tiny">${t.open} signalement(s) ouvert(s)</span></p>
      ${r.text?`<blockquote>${esc(r.text)}</blockquote>`:''}</div>
      ${r.status==='open'?`<div class="acts"><button class="btn sm" type="button" data-act="rep" data-a="${r.id}:ignore">Ignorer</button><button class="btn sm" type="button" data-act="rep" data-a="${r.id}:warn">Avertir</button><button class="btn sm" type="button" data-act="player" data-a="${t.id}">Ouvrir la fiche…</button><button class="btn sm sun" type="button" data-act="rep" data-a="${r.id}:suspend">Suspendre 7 j</button></div>`:''}
    </article>`;}).join('')}</div>`:`<div class="empty"><b>${S.ui.mod==='open'?'Aucun signalement ouvert':'Aucun signalement traité'}</b></div>`);
};

/* ========================= anti-cheat ========================= */
V.anticheat=()=>{
  const list=S.d.flags,R=S.d.rules,c=S.counts||{};
  return head('Communauté','Anti-triche','Les scores qui déclenchent une règle restent hors des classements jusqu’à ta décision. Le serveur recalcule déjà chaque score : ces règles sont un deuxième filet.',tabs(S.ui.ac,'acTab',[['pending','À examiner',c.flags],['done','Traités',null]]))+`
  <div class="grid">
    <section class="c12">${!list?loading():list.length?`<div class="tblw"><table class="tbl"><thead><tr><th>Joueur</th><th>Jeu</th><th class="num">Résultat</th><th>Règle</th><th>Détail</th><th class="num">Confiance</th><th>Date</th><th></th></tr></thead><tbody>
      ${list.map(f=>`<tr><td><button class="btn sm ghost" type="button" data-act="player" data-a="${f.player.id}" style="padding:0 4px">${pav(f.player,24)} ${esc(f.player.name)}</button></td><td><span class="dot" style="background:${GM(f.game).col};border:1.5px solid #17142A"></span> ${esc(skLabel(f.sk))}</td><td class="num">${fmtScore(f.sk,f.score)}</td><td>${esc((RULES_META[f.rule]||{n:f.rule}).n)}</td><td class="tiny">${esc(f.detail||'')}</td>
        <td class="num"><span class="badge ${f.conf>=85?'bad':f.conf>=60?'warn':''}">${f.conf??'—'} %</span></td><td>${ago(f.t)}</td>
        <td class="act">${f.status==='pending'?`<button class="btn sm" type="button" data-act="flag" data-a="${f.id}:valid">Valider</button> <button class="btn sm sun" type="button" data-act="flag" data-a="${f.id}:void">Annuler le score</button> <button class="btn sm danger" type="button" data-act="flag" data-a="${f.id}:voidban">Annuler + suspendre</button>`:`<span class="badge ${f.status==='valid'?'good':'bad'}">${f.status==='valid'?'Validé':'Annulé'}</span>`}</td></tr>`).join('')}
    </tbody></table></div>`:`<div class="empty"><b>${S.ui.ac==='pending'?'Aucun score à examiner':'Rien de traité pour l’instant'}</b></div>`}</section>
    <section class="card c7"><div class="card-h"><h2>Règles de détection</h2><button class="btn sm primary" type="button" data-act="saveRules" ${R?'':'disabled'}>Enregistrer les règles</button></div>
      ${R?`<div>${Object.entries(RULES_META).map(([k,m])=>`<div class="rule">${sw('ruleOn',k,R[k].on,m.n)}<span><b>${m.n}</b><span class="tiny">${m.d}</span></span><span class="row" style="flex-wrap:nowrap"><input class="input mono" type="number" step="any" min="0" id="rule_${k}" value="${R[k].val}" aria-label="Seuil ${esc(m.n)}" style="width:76px"><span class="tiny">${m.unit}</span></span></div>`).join('')}
      <div class="rule">${sw('autoVoid','x',R.autoVoid,'Annulation automatique')}<span><b>Annulation automatique au-dessus de 95 % de confiance</b><span class="tiny">Sinon, tout passe par une décision humaine.</span></span><span></span></div></div>`:loading()}
    </section>
    <section class="card c5"><div class="card-h"><h2>Classements</h2></div>
      <p class="tiny">Remet à zéro un classement après une faille ou un changement de règles. Les parties sont archivées, pas supprimées.</p>
      <div class="field"><label for="lbReset">Classement</label><select class="input" id="lbReset"><option value="rating">Cote compétitive (retour à 1 000)</option>${GAMES0.filter(g=>!g.dev).flatMap(g=>g.id==='sprint'?TRACKS.map((t,i)=>`<option value="sprint@${i}">Neon Sprint · ${t}</option>`):[`<option value="${g.id}">${g.name}</option>`]).join('')}</select></div>
      <button class="btn danger" type="button" data-act="askLbReset">Réinitialiser…</button>
    </section>
  </div>`;
};

/* ========================= content ========================= */
V.content=()=>{
  const t=S.ui.ct,d=S.d;
  const top=head('Produit','Contenu des jeux','Questions, mots et réglages des jeux. Les changements sont visibles dans le jeu immédiatement.',tabs(t,'ctTab',[['questions','Questions Brain Battle',d.questions?d.questions.length:null],['words','Mots Word Rush',null],['games','Jeux',null]]));
  if(t==='words')return top+wordsView();
  if(t==='games')return top+gamesView();
  if(!d.questions)return top+loading();
  const f=S.ui.qf,q=f.q.trim().toLowerCase();
  const list=d.questions.filter(x=>(!q||x.q.fr.toLowerCase().includes(q)||x.q.en.toLowerCase().includes(q))&&(f.cat==='all'||x.cat===f.cat)&&(f.status==='all'||x.status===f.status));
  const pub=d.questions.filter(x=>x.status==='published').length;
  return top+`${pub<8?`<div class="empty" style="border-color:var(--bad);background:var(--bad-soft);margin-bottom:12px"><b>Moins de 8 questions publiées</b>Brain Battle ne peut pas démarrer tant qu’il n’y en a pas au moins 8.</div>`:''}
  <div class="filters" style="margin-bottom:12px">
    <div class="search">${ic('search',16)}<input class="input" id="qq" data-in="qq" value="${esc(f.q)}" placeholder="Rechercher une question" aria-label="Rechercher une question"></div>
    <div class="field"><label for="qcat">Catégorie</label><select class="input" id="qcat" data-ch="qcat"><option value="all">Toutes</option>${Object.entries(QCATS).map(([k,v])=>`<option value="${k}" ${f.cat===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label for="qst">Statut</label><select class="input" id="qst" data-ch="qst"><option value="all">Tous</option><option value="published" ${f.status==='published'?'selected':''}>Publiées</option><option value="draft" ${f.status==='draft'?'selected':''}>Brouillons</option></select></div>
    <button class="btn primary" type="button" data-act="qEdit" data-a="">${ic('plus',15)}Nouvelle question</button>
  </div>
  ${list.length?`<div class="tblw"><table class="tbl"><thead><tr><th>Question</th><th>Catégorie</th><th>Statut</th><th class="num">Réponses</th><th class="num">Réussite</th><th></th></tr></thead><tbody>
    ${list.map(x=>{const hard=x.plays>100&&x.rate<20,easy=x.plays>100&&x.rate>95;return `<tr><td style="min-width:260px"><b>${esc(x.q.fr)}</b><span class="sub">${esc(x.q.en)}</span><span class="sub">✓ ${esc(x.a[x.correct].fr)}</span></td><td>${QCATS[x.cat]}</td>
      <td>${x.status==='published'?'<span class="badge good">Publiée</span>':'<span class="badge warn">Brouillon</span>'}</td><td class="num">${fmt(x.plays)}</td>

function confirmHTML(c){
  return `<div class="m-h"><div><h2>${esc(c.title)}</h2><p>${esc(c.body)}</p></div><button class="x" type="button" data-act="close" aria-label="Fermer">${ic('x')}</button></div>
  ${c.reason?`<div class="field"><label for="cfReason">Motif (obligatoire)</label><select class="input" id="cfReason">${MOTIFS.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="field"><label for="cfNote">Précisions</label><textarea class="input" id="cfNote" placeholder="Ce que l’équipe doit savoir"></textarea></div>`:''}
  ${c.kind==='schoolMerge'?`<div class="field"><label for="cfInto">École à garder</label><select class="input" id="cfInto">${(S.d.schools?S.d.schools.schools:[]).filter(s=>s.id!==c.sid).map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.city)} (${esc(s.short)}, ${s.players} joueur${s.players>1?'s':''})</option>`).join('')}</select></div>`:''}
  ${c.word?`<div class="field"><label for="cfType">Tape <b>${esc(c.word)}</b> pour confirmer</label><input class="input mono" id="cfType" autocomplete="off"></div><p class="tiny" id="cfErr" style="color:var(--bad);font-weight:600"></p>`:''}
  <div class="row"><button class="btn ${c.danger?'danger':'primary'}" type="button" data-act="confirmYes">${esc(c.ok)}</button><button class="btn ghost" type="button" data-act="close">Annuler</button></div>`;
}
function renderLayer(){
  const Lr=S.ui.layer,el=$('#layer');
  if(!Lr){el.innerHTML='';return;}
  let body='',cls='modal';
  if(Lr.type==='player'){cls='drawer';body=playerDrawer();}
  else if(Lr.type==='q')body=qEditor(Lr.id);
  else if(Lr.type==='comp')body=compForm();
  else if(Lr.type==='school')body=schoolForm(Lr.id);
  else if(Lr.type==='confirm')body=confirmHTML(Lr);
  el.innerHTML=`<div class="scrim" data-act="scrim"></div><div class="${cls}" role="dialog" aria-modal="true">${body}</div>`;
}
function render(){
  const ae=document.activeElement,keep=ae&&ae.id&&$('#main').contains(ae)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  $('#rail').innerHTML=railHTML();$('#top').innerHTML=topHTML();
  if(S.auth.stage!=='ready'){$('#main').innerHTML=gateHTML();$('#layer').innerHTML='';return;}
  const sec=S.ui.sec;
  $('#main').innerHTML=(S.d.err?`<div class="empty" style="border-color:var(--bad);background:var(--bad-soft);margin-bottom:14px"><b>Chargement impossible</b>${esc(S.d.err)}<button class="btn sm" type="button" data-act="sec" data-a="${sec}">Réessayer</button></div>`:'')+(can(sec)?V[sec]():`<div class="denied">${ic('lock',28)}<h2>Accès refusé pour le rôle ${ROLES[S.role]}</h2></div>`);
  renderLayer();
  if(keep){const n=document.getElementById(keep.id);if(n){n.focus();try{n.setSelectionRange(keep.s,keep.e);}catch(e){}}}
}

async function openPlayer(id){S.d.player=null;openLayer({type:'player',id});try{S.d.player=await rpc('admin_player',{p_id:id});}catch(e){toast(errText(e));}if(S.ui.layer&&S.ui.layer.type==='player')renderLayer();}
async function playerAction(action,args){
  const id=S.ui.layer.id;

  catch(e){toast(errText(e));return false;}
}

    try{
      if(c.kind==='ban'){S.ui.layer={type:'player',id:c.pid};await playerAction('ban',{motif:$('#cfReason')?$('#cfReason').value:'',note:''});toast('Joueur banni.');return;}
      if(c.kind==='resetScores'){S.ui.layer={type:'player',id:c.pid};await playerAction('reset_scores');toast('Scores réinitialisés.');return;}
      if(c.kind==='lbReset')await act('admin_reset_board',{p_board:c.board},'Classement réinitialisé.');
      if(c.kind==='qDel')await act('admin_question_action',{p_id:c.qid,p_action:'delete'},'Question supprimée.');
      if(c.kind==='compCancel')await act('admin_comp_action',{p_id:c.cid,p_action:'cancel'},'Compétition annulée.');
      if(c.kind==='seasonClose')await act('admin_season_action',{p_action:'close'},'Nouvelle saison lancée.');
      if(c.kind==='schoolMerge')await act('admin_merge_school',{p_from:c.sid,p_into:$('#cfInto').value},'Écoles fusionnées.');
      if(c.kind==='schoolDel')await act('admin_delete_school',{p_id:c.sid},'École supprimée.');
      if(c.kind==='removeAdmin')S.d.team=await act('admin_team_action',{p_action:'remove',p:{id:c.uid}},'Membre retiré.');
      closeLayer();loadSection();
    }catch(e){}
  }
};

/* ========================= events ========================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn)fn(el.dataset.a,el,e);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.ui.layer)closeLayer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.ch;if(!k)return;const v=e.target.value,f=S.ui.pl;
  if(['pls','plsc','plv'].includes(k)){if(k==='pls')f.status=v;if(k==='plsc')f.school=v;if(k==='plv')f.ver=v;f.page=0;loadPlayers().then(render).catch(err=>toast(errText(err)));}
  if(k==='qcat'){S.ui.qf.cat=v;render();}if(k==='qst'){S.ui.qf.status=v;render();}
  if(k==='dailyGame'){S.d.comps.daily[+e.target.dataset.i].game=v;render();}
  if(k==='adminRole'){act('admin_team_action',{p_action:'role',p:{id:e.target.dataset.id,role:v}},'Rôle modifié.').then(t=>{S.d.team=t;render();}).catch(()=>loadSection());}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const v=e.target.value;
  if(k==='plq'){S.ui.pl.q=v;S.ui.pl.page=0;clearTimeout(plTimer);plTimer=setTimeout(()=>loadPlayers().then(()=>{$('#plTable').innerHTML=playersTable();}).catch(err=>toast(errText(err))),300);}
  if(k==='qq'){S.ui.qf.q=v;render();}
  if(k==='logq'){S.ui.logq=v;clearTimeout(plTimer);plTimer=setTimeout(async()=>{try{S.d.log=await rpc('admin_log',{p_q:v,p_limit:100});$('#logBox').innerHTML=logList(S.d.log);}catch(err){toast(errText(err));}},300);}
});
document.addEventListener('submit',async e=>{
  const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();
  const F=n=>(f.elements[n]?String(f.elements[n].value):'').trim(),btn=f.querySelector('button[type=submit]');
  const gateErr=m=>{S.auth.err=m;render();};
  if(k==='login'){btn.disabled=true;const {error}=await sb.auth.signInWithPassword({email:F('email'),password:f.elements.pw.value});
    if(error){S.auth={stage:'login',err:/confirm/i.test(error.message)?'Confirme d’abord ton e-mail.':/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect.':errText(error)};render();return;}
    afterLogin();return;}
  if(k==='recover'){await sb.auth.resetPasswordForEmail(F('email'),{redirectTo:location.origin+location.pathname});S.auth={stage:'login',err:'Si un compte existe, un lien de réinitialisation a été envoyé.'};render();return;}
  if(k==='newpw'){const pw=f.elements.pw.value;if(pw.length<12){gateErr('Utilise au moins 12 caractères pour un compte d’équipe.');return;}const {error}=await sb.auth.updateUser({password:pw});if(error){gateErr(errText(error));return;}afterLogin();return;}
  if(k==='mfa'){const code=F('code').replace(/\s/g,'');if(!/^\d{6}$/.test(code)){gateErr('Saisis les 6 chiffres affichés dans ton application.');return;}btn.disabled=true;
    const {error}=await sb.auth.mfa.challengeAndVerify({factorId:S.auth.factorId,code});
    if(error){S.auth.err='Code incorrect ou expiré. Réessaie avec le code suivant.';render();return;}
    afterLogin();return;}
  const d=S.d;
  try{
    if(k==='question'){
      const a=[0,1,2,3].map(i=>({fr:F('a'+i+'fr'),en:F('a'+i+'en')})),corr=+(f.querySelector('input[name=correct]:checked')||{value:0}).value;
      const p={id:f.dataset.id||null,cat:F('cat'),status:F('status'),q:{fr:F('qfr'),en:F('qen')},a,correct:corr};
      try{await rpc('admin_save_question',{p});}catch(err){S.ui.layer.err=errText(err);S.ui.layer.draft=p;renderLayer();return;}
      closeLayer();toast('Question enregistrée.');refreshCounts();loadSection();
    }
    if(k==='word'){const r=await act('admin_word',{p_lang:S.ui.wl,p_word:F('w'),p_cat:F('c'),p_action:'add'});toast(r.anagram?`${r.word} ajouté. Anagramme de ${r.anagram} : les deux sont acceptés.`:`${r.word} ajouté.`);loadSection();}
    if(k==='comp'){
      const v={name:F('name'),game:F('game'),format:F('format'),start:F('start'),end:F('end'),vis:F('vis'),school:F('school'),sponsor:F('sponsor'),reward:F('reward')};
      if(!v.start||!v.end){S.ui.layer.err='Choisis les dates.';S.ui.layer.vals=v;renderLayer();return;}
      try{await rpc('admin_save_comp',{p:Object.assign({},v,{start:new Date(v.start+'T09:00:00').toISOString(),end:new Date(v.end+'T23:00:00').toISOString()})});}
      catch(err){S.ui.layer.err=errText(err);S.ui.layer.vals=v;renderLayer();return;}
      closeLayer();S.ui.cp='list';toast('Compétition créée.');loadSection();
    }
    if(k==='school'){
      const v={id:f.dataset.id||null,name:F('name'),short:F('short').toUpperCase(),domain:F('domain').toLowerCase(),city:F('city'),country:F('country'),status:F('status'),col:(f.querySelector('input[name=col]:checked')||{value:'#5B4BFF'}).value};
      try{await rpc('admin_save_school',{p:v});}catch(err){S.ui.layer.err=errText(err);S.ui.layer.vals=v;renderLayer();return;}
      closeLayer();toast('Établissement enregistré.');loadSection();
    }
    if(k==='mgr'){await act('admin_manager',{p_action:'add',p:{name:F('name'),email:F('mail'),school:F('school'),role:F('role')}},'Responsable ajouté.');loadSection();}
    if(k==='invoice'){await act('admin_invoice',{p_action:'add',p:{client:F('client'),type:F('type'),amount:+F('amount'),due:F('due')}},'Facture créée.');loadSection();}
    if(k==='sponsor'){await act('admin_sponsor',{p:{name:F('name'),contract:F('contract'),period:F('period'),amount:+F('amount')||0,status:F('status')}},'Sponsor ajouté.');loadSection();}
    if(k==='admin'){S.d.team=await act('admin_team_action',{p_action:'invite',p:{mail:F('mail'),role:F('role')}},'Invitation créée. Préviens la personne.');loadSection();}
  }catch(err){}
});

/* ========================= démarrage ========================= */
if(CONFIGURED){
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){S.auth={stage:'newpw'};render();}if(ev==='SIGNED_OUT'){S.role=null;S.auth={stage:'login'};render();}});
  sb.auth.getSession().then(({data})=>{if(data&&data.session)afterLogin();else{S.auth={stage:'login'};render();}});
}else{S.auth={stage:'config'};render();}
})();
</script>
</html>
